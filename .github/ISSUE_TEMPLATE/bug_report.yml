name: Bug report
description: Something in mcp-expect isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        A `.mcptest.ts` file and enough of the server under test to reproduce
        it — real assertions against a real server, not a description.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-expect version
      placeholder: "0.1.2"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: "node --version"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - Streamable HTTP
        - Not transport-related
    validations:
      required: true
