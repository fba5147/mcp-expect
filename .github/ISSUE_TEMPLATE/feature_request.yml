name: Feature request
description: Propose a new assertion, CLI capability, or other change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        What are you unable to test or express about an MCP server today?
        Concrete failure scenario, not just "it would be nice to have."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the assertion or CLI flag as you imagine using it.
      render: ts
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        See the README's "What this is not (v1 scope)" section before
        proposing something like multi-model grading or full protocol
        conformance testing — those are deliberately out of scope for now.
      options:
        - label: I've checked this fits the project's stated v1 scope
          required: true
